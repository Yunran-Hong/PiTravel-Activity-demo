<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圆周旅迹 | 旅行答案之书</title>
    <style>
:root {
  color-scheme: dark;
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC",
    "Microsoft YaHei", sans-serif;
  --white: #f8fbff;
  --mist: rgba(248, 251, 255, 0.72);
  --line: rgba(255, 255, 255, 0.48);
  --glass: rgba(255, 255, 255, 0.12);
  --blue: #7fd8ff;
  --deep-blue: #092b52;
  --violet: #c797ff;
  --rose: #f4a5d7;
  --ink: #071525;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 12%, rgba(83, 176, 255, 0.24), transparent 35%),
    linear-gradient(135deg, #08111d 0%, #0e2238 58%, #10131f 100%);
  color: var(--white);
  overflow: hidden;
}

button,
textarea {
  font: inherit;
}

button {
  border: 0;
  color: inherit;
  cursor: pointer;
}

.phone-shell {
  position: relative;
  width: min(100vw, 430px);
  height: min(100vh, 932px);
  min-height: 720px;
  overflow: hidden;
  background: #081827;
  isolation: isolate;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
}

.ambient,
.ambient::before,
.ambient::after {
  position: absolute;
  inset: 0;
  z-index: -4;
}

.ambient {
  background:
    radial-gradient(circle at 20% 16%, rgba(103, 217, 231, 0.75), transparent 26%),
    radial-gradient(circle at 72% 20%, rgba(211, 133, 255, 0.86), transparent 28%),
    radial-gradient(circle at 48% 52%, rgba(7, 35, 35, 0.92), transparent 33%),
    radial-gradient(circle at 78% 78%, rgba(103, 217, 231, 0.74), transparent 24%),
    linear-gradient(160deg, #123e63 0%, #8866b5 48%, #d091bd 100%);
  filter: saturate(1.2);
}

.ambient::before {
  content: "";
  background:
    linear-gradient(90deg, transparent 0 10%, rgba(255, 255, 255, 0.04) 10% 10.4%, transparent 10.4% 100%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.16), transparent 2px);
  background-size: 100% 100%, 64px 64px;
  mix-blend-mode: overlay;
  opacity: 0.5;
}

.ambient::after {
  content: "";
  background: rgba(3, 9, 16, 0.1);
  backdrop-filter: blur(34px);
}

.blob {
  position: absolute;
  width: 68%;
  aspect-ratio: 1;
  border-radius: 999px;
  filter: blur(28px);
  mix-blend-mode: screen;
  opacity: 0.48;
  animation: drift 13s ease-in-out infinite alternate;
}

.blob-a {
  left: -22%;
  top: 10%;
  background: #6ee7ff;
}

.blob-b {
  right: -24%;
  top: 2%;
  background: #da8cff;
  animation-duration: 16s;
}

.blob-c {
  left: 16%;
  bottom: -20%;
  background: #ff9ac9;
  animation-duration: 18s;
}

.halo {
  position: absolute;
  left: 50%;
  top: 49%;
  width: 108%;
  height: 84%;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow:
    inset 0 0 34px rgba(255, 255, 255, 0.18),
    0 0 42px rgba(210, 180, 255, 0.22);
  animation: breathe 5.8s ease-in-out infinite;
}

.star-field {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, rgba(255, 255, 255, 0.84) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(255, 255, 255, 0.5) 0 1px, transparent 1.6px);
  background-position:
    14px 90px,
    80px 38px;
  background-size:
    112px 124px,
    172px 150px;
  opacity: 0.24;
  animation: shimmer 9s linear infinite;
}

.topbar {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 76px;
  padding: 18px 22px 10px;
}

.icon-button,
.mini-button,
.brand-mark {
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.24);
  box-shadow: 0 0 18px rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(12px);
}

.icon-button {
  width: 38px;
  height: 38px;
  border-radius: 999px;
  font-size: 34px;
  line-height: 1;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.86);
  color: var(--deep-blue);
  font-weight: 900;
}

.top-actions {
  display: flex;
  gap: 9px;
}

.mini-button {
  width: 30px;
  height: 30px;
  border-radius: 999px;
  font-weight: 800;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 98px 26px 92px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(18px) scale(0.985);
  visibility: hidden;
  transition:
    opacity 360ms ease,
    transform 360ms ease,
    visibility 0s;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
  visibility: visible;
  transition:
    opacity 360ms ease,
    transform 360ms ease;
}

.screen-heading {
  text-align: center;
  margin: 24px 0 30px;
}

.screen-heading.compact {
  margin-bottom: 18px;
}

.eyebrow {
  margin: 0 0 8px;
  color: rgba(255, 255, 255, 0.76);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 14px;
  font-size: clamp(50px, 16vw, 76px);
  line-height: 0.9;
  letter-spacing: 0;
  text-shadow: 0 0 22px rgba(255, 255, 255, 0.54);
}

h2 {
  margin-bottom: 0;
  font-size: 24px;
  line-height: 1.25;
  letter-spacing: 0;
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.3);
}

.intro-portal {
  position: relative;
  display: grid;
  place-items: center;
  flex: 1;
  min-height: 470px;
}

.portal-glass {
  position: absolute;
  width: min(92vw, 382px);
  height: min(72vh, 650px);
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(8, 46, 42, 0.76), transparent 32%),
    radial-gradient(circle at 26% 24%, rgba(255, 186, 219, 0.58), transparent 28%),
    radial-gradient(circle at 78% 62%, rgba(107, 225, 255, 0.46), transparent 26%),
    rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.34);
  box-shadow:
    inset 0 0 42px rgba(255, 255, 255, 0.15),
    0 0 46px rgba(233, 176, 255, 0.36);
  backdrop-filter: blur(14px);
  animation: liquid 8s ease-in-out infinite alternate;
}

.intro-copy {
  position: relative;
  width: min(86%, 320px);
  text-align: center;
}

.intro-copy p:last-child {
  margin-bottom: 0;
  color: var(--mist);
  font-size: 16px;
  font-weight: 700;
}

.primary-button,
.ghost-button,
.icon-text-button {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(14px);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.12),
    0 12px 34px rgba(0, 0, 0, 0.16);
}

.primary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  min-height: 58px;
  width: min(100%, 310px);
  margin: 0 auto;
  border-radius: 999px;
  font-weight: 900;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.primary-button:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

.ghost-button {
  align-self: center;
  min-width: 168px;
  min-height: 46px;
  margin-top: auto;
  border-radius: 999px;
  color: rgba(255, 255, 255, 0.88);
  font-weight: 800;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
}

.category-card {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 128px;
  padding: 14px 10px 12px;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.58);
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(12px);
  text-align: left;
}

.category-card::before {
  content: "";
  position: absolute;
  inset: -34%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.22), transparent 45%);
  opacity: 0;
  transform: scale(0.6);
  transition:
    opacity 220ms ease,
    transform 220ms ease;
}

.category-card:hover::before,
.category-card:focus-visible::before {
  opacity: 1;
  transform: scale(1);
}

.category-card span {
  position: relative;
}

.category-icon {
  width: 42px;
  height: 42px;
  margin-inline: auto;
  color: white;
}

.category-title {
  font-size: 14px;
  font-weight: 900;
  line-height: 1.15;
  text-align: center;
}

.question-list {
  display: grid;
  gap: 10px;
  max-height: 294px;
  overflow: auto;
  padding: 2px 2px 8px;
  scrollbar-width: none;
}

.question-list::-webkit-scrollbar {
  display: none;
}

.question-option {
  width: 100%;
  min-height: 58px;
  padding: 13px 15px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.42);
  background: rgba(3, 23, 38, 0.24);
  color: rgba(255, 255, 255, 0.86);
  text-align: left;
  line-height: 1.35;
  backdrop-filter: blur(10px);
}

.question-option.selected {
  border-color: rgba(255, 255, 255, 0.86);
  background: rgba(255, 255, 255, 0.18);
  box-shadow: 0 0 22px rgba(183, 226, 255, 0.26);
}

.custom-question {
  display: grid;
  gap: 8px;
  margin: 16px 0 18px;
  color: rgba(255, 255, 255, 0.7);
  font-size: 12px;
  font-weight: 800;
}

.custom-question textarea {
  width: 100%;
  resize: none;
  min-height: 68px;
  padding: 14px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.46);
  outline: 0;
  background: rgba(255, 255, 255, 0.12);
  color: white;
  backdrop-filter: blur(12px);
}

.custom-question textarea::placeholder {
  color: rgba(255, 255, 255, 0.48);
}

.fingerprint {
  position: relative;
  display: grid;
  place-items: center;
  width: 118px;
  height: 118px;
  margin: auto auto 24px;
  border-radius: 999px;
  background:
    radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 58%),
    rgba(2, 24, 37, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.44);
  box-shadow:
    0 0 40px rgba(255, 255, 255, 0.24),
    inset 0 0 28px rgba(255, 255, 255, 0.12);
  animation: pulse 2.4s ease-in-out infinite;
}

.fingerprint span,
.fingerprint::before,
.fingerprint::after {
  position: absolute;
  display: block;
  border: 2px solid rgba(255, 255, 255, 0.82);
  border-left-color: transparent;
  border-bottom-color: transparent;
  border-radius: 50%;
  content: "";
}

.fingerprint span {
  width: 34px;
  height: 52px;
  transform: rotate(-25deg);
}

.fingerprint::before {
  width: 54px;
  height: 70px;
  transform: rotate(-25deg);
  opacity: 0.56;
}

.fingerprint::after {
  width: 78px;
  height: 94px;
  transform: rotate(-25deg);
  opacity: 0.28;
}

.ritual-tip {
  margin-bottom: 42px;
  text-align: center;
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
  text-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
}

.result-card {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

.result-card h2 {
  width: min(100%, 340px);
  margin: 0 auto 26px;
}

.route-oracle {
  width: min(100%, 328px);
  min-height: 168px;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  padding: 22px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.52);
  background:
    radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.22), transparent 34%),
    rgba(255, 255, 255, 0.12);
  box-shadow:
    inset 0 0 32px rgba(255, 255, 255, 0.12),
    0 0 42px rgba(171, 223, 255, 0.2);
  font-size: 36px;
  font-weight: 950;
  line-height: 1.08;
  text-shadow: 0 0 22px rgba(255, 255, 255, 0.42);
}

.route-note {
  width: min(100%, 330px);
  margin: 0 auto 18px;
  color: rgba(255, 255, 255, 0.82);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.55;
}

.itinerary {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  width: min(100%, 330px);
  margin: 0 auto;
}

.itinerary span {
  padding: 7px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  background: rgba(255, 255, 255, 0.12);
  color: rgba(255, 255, 255, 0.82);
  font-size: 12px;
  font-weight: 800;
}

.result-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.icon-text-button {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-height: 50px;
  padding: 0 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 900;
}

.bottom-pill {
  position: absolute;
  left: 50%;
  bottom: 24px;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: min(62%, 260px);
  height: 38px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(16px);
  transform: translateX(-50%);
}

.bottom-pill span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.56);
  transition:
    width 220ms ease,
    background 220ms ease;
}

.bottom-pill span.active {
  width: 22px;
  border-radius: 999px;
  background: white;
}

.toast {
  position: absolute;
  left: 26px;
  right: 26px;
  bottom: 76px;
  z-index: 30;
  padding: 13px 16px;
  border: 1px solid rgba(255, 255, 255, 0.36);
  border-radius: 8px;
  background: rgba(4, 20, 34, 0.78);
  text-align: center;
  font-size: 13px;
  font-weight: 800;
  backdrop-filter: blur(16px);
  animation: toast 2s ease forwards;
}

@keyframes drift {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }

  100% {
    transform: translate3d(9%, 7%, 0) scale(1.16);
  }
}

@keyframes breathe {
  0%,
  100% {
    transform: translate(-50%, -50%) scale(0.98);
    opacity: 0.52;
  }

  50% {
    transform: translate(-50%, -50%) scale(1.03);
    opacity: 0.86;
  }
}

@keyframes shimmer {
  100% {
    background-position:
      14px 214px,
      80px 188px;
  }
}

@keyframes liquid {
  0% {
    border-radius: 48% 52% 51% 49% / 56% 49% 51% 44%;
    transform: scale(0.98) rotate(-1deg);
  }

  100% {
    border-radius: 53% 47% 48% 52% / 48% 55% 45% 52%;
    transform: scale(1.02) rotate(1deg);
  }
}

@keyframes pulse {
  50% {
    transform: scale(1.08);
    box-shadow:
      0 0 60px rgba(255, 255, 255, 0.34),
      inset 0 0 34px rgba(255, 255, 255, 0.18);
  }
}

@keyframes toast {
  0% {
    opacity: 0;
    transform: translateY(8px);
  }

  14%,
  82% {
    opacity: 1;
    transform: translateY(0);
  }

  100% {
    opacity: 0;
    transform: translateY(8px);
  }
}

@media (max-width: 360px) {
  .phone-shell {
    min-height: 640px;
  }

  .screen {
    padding-inline: 18px;
  }

  .category-card {
    min-height: 112px;
  }

  .category-title {
    font-size: 12px;
  }

  .route-oracle {
    font-size: 30px;
  }
}

</style>
  </head>
  <body>
    <main class="phone-shell" aria-live="polite">
      <div class="ambient" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
        <span class="halo"></span>
        <span class="star-field"></span>
      </div>

      <header class="topbar">
        <button class="icon-button" type="button" data-back aria-label="返回">
          <span aria-hidden="true">‹</span>
        </button>
        <div class="brand-mark" aria-label="圆周旅迹">圆</div>
        <div class="top-actions">
          <button class="mini-button" type="button" aria-label="活动说明">i</button>
          <button class="mini-button" type="button" aria-label="更多">···</button>
        </div>
      </header>

      <section class="screen active" data-screen="intro">
        <div class="portal intro-portal">
          <div class="portal-glass"></div>
          <div class="intro-copy">
            <p class="eyebrow">限时活动</p>
            <h1>旅行答案之书</h1>
            <p>把心里的问题交给一条城市路线。</p>
          </div>
        </div>
        <button class="primary-button" type="button" data-start>
          <span>开始占卜</span>
          <span aria-hidden="true">›</span>
        </button>
      </section>

      <section class="screen" data-screen="categories">
        <div class="screen-heading">
          <p class="eyebrow">选择占卜类别</p>
          <h2>你想问哪一种风向？</h2>
        </div>
        <div class="category-grid" data-category-grid></div>
        <button class="ghost-button" type="button" data-random-category>
          替我抽一张
        </button>
      </section>

      <section class="screen" data-screen="questions">
        <div class="screen-heading compact">
          <p class="eyebrow" data-selected-category-label>问题池</p>
          <h2>选一个今天最有感的问题</h2>
        </div>
        <div class="question-list" data-question-list></div>
        <label class="custom-question">
          <span>或者自己写一句</span>
          <textarea data-custom-question maxlength="42" rows="2" placeholder="例如：我该不该订下个月去大理的票？"></textarea>
        </label>
        <button class="primary-button" type="button" data-to-ritual disabled>
          <span>把问题交给路线</span>
          <span aria-hidden="true">›</span>
        </button>
      </section>

      <section class="screen" data-screen="ritual">
        <div class="screen-heading">
          <p class="eyebrow">正在听取城市回声</p>
          <h2 data-ritual-question></h2>
        </div>
        <button class="fingerprint" type="button" data-generate aria-label="生成答案">
          <span></span>
        </button>
        <p class="ritual-tip">按住心跳，生成路线答案</p>
      </section>

      <section class="screen" data-screen="result">
        <div class="result-card">
          <p class="eyebrow" data-result-category></p>
          <h2 data-result-question></h2>
          <div class="route-oracle" data-result-route></div>
          <p class="route-note" data-result-note></p>
          <div class="itinerary" data-result-itinerary></div>
        </div>
        <div class="result-actions">
          <button class="icon-text-button" type="button" data-regenerate>
            <span aria-hidden="true">↻</span>
            <span>再问一次</span>
          </button>
          <button class="icon-text-button" type="button" data-share>
            <span aria-hidden="true">⇧</span>
            <span>生成分享卡</span>
          </button>
        </div>
      </section>

      <nav class="bottom-pill" aria-label="流程">
        <span data-step-dot="intro"></span>
        <span data-step-dot="categories"></span>
        <span data-step-dot="questions"></span>
        <span data-step-dot="ritual"></span>
        <span data-step-dot="result"></span>
      </nav>
    </main>

    <script>
const oracleData = [
  {
    id: "love",
    title: "爱情",
    icon: "♡",
    questions: [
      "crush 会喜欢我吗？",
      "我是不是该放下 TA 了？",
      "这段关系还值得继续吗？",
      "我最近会遇到正缘吗？",
    ],
    yes: [
      {
        route: "厦门环岛路日落路线",
        note: "海风已经把暧昧吹到你这边了。慢慢走，不用抢答。",
        stops: ["黄厝海滩", "沙坡尾", "八市夜宵"],
      },
      {
        route: "成都玉林小酒馆路线",
        note: "这不是轰轰烈烈，是会有人把你的冷笑话接住。",
        stops: ["玉林路", "芳草街", "夜晚小酒馆"],
      },
    ],
    no: [
      {

const state = {
  screen: "intro",
  category: null,
  question: "",
  selectedQuestionIndex: null,
  lastAnswer: null,
};

const screens = document.querySelectorAll("[data-screen]");
const dots = document.querySelectorAll("[data-step-dot]");
const backButton = document.querySelector("[data-back]");
const categoryGrid = document.querySelector("[data-category-grid]");
const questionList = document.querySelector("[data-question-list]");
const categoryLabel = document.querySelector("[data-selected-category-label]");
const customQuestion = document.querySelector("[data-custom-question]");
const toRitualButton = document.querySelector("[data-to-ritual]");
const ritualQuestion = document.querySelector("[data-ritual-question]");

function setScreen(screen) {
  state.screen = screen;
  screens.forEach((item) => item.classList.toggle("active", item.dataset.screen === screen));
  dots.forEach((dot) => dot.classList.toggle("active", dot.dataset.stepDot === screen));
  backButton.style.visibility = screen === "intro" ? "hidden" : "visible";
}

function renderCategories() {
  categoryGrid.innerHTML = oracleData
    .map(
      (category) => `
        <button class="category-card" type="button" data-category="${category.id}">
          <span class="category-icon">${category.icon}</span>
          <span class="category-title">${category.title}</span>
        </button>
      `,
    )
    .join("");
}

function renderQuestions() {
  categoryLabel.textContent = state.category.title;
  questionList.innerHTML = state.category.questions
    .map(
      (question, index) => `
        <button class="question-option" type="button" data-question-index="${index}">
          ${question}
        </button>
      `,
    )
    .join("");
  customQuestion.value = "";
  state.question = "";
  state.selectedQuestionIndex = null;
  toRitualButton.disabled = true;
}

function chooseCategory(category) {
  state.category = category;
  renderQuestions();
  setScreen("questions");
}

function chooseQuestion(question, index) {
  state.question = question;
  state.selectedQuestionIndex = index;
  customQuestion.value = "";
  document.querySelectorAll(".question-option").forEach((button) => {
    button.classList.toggle("selected", Number(button.dataset.questionIndex) === index);
  });
  toRitualButton.disabled = false;
}

function getAnswerPool() {
  if (!state.category) return [];
  const text = state.question;
  const yesSignals = ["会", "适合", "值得", "能", "该", "要不要", "能不能"];
  const noSignals = ["放下", "辞职", "踩雷", "无聊", "停下来", "买这个大件"];
  const wantsNo = noSignals.some((word) => text.includes(word));
  const wantsYes = yesSignals.some((word) => text.includes(word));
  if (wantsNo && Math.random() > 0.28) return state.category.no;
  if (wantsYes && Math.random() > 0.42) return state.category.yes;
  return Math.random() > 0.5 ? state.category.yes : state.category.no;
}

function generateAnswer() {
  const pool = getAnswerPool();
  const answer = pool[Math.floor(Math.random() * pool.length)];
  state.lastAnswer = answer;
  document.querySelector("[data-result-category]").textContent = state.category.title;
  document.querySelector("[data-result-question]").textContent = state.question;
  document.querySelector("[data-result-route]").textContent = answer.route;
  document.querySelector("[data-result-note]").textContent = answer.note;
  document.querySelector("[data-result-itinerary]").innerHTML = answer.stops
    .map((stop) => `<span>${stop}</span>`)
    .join("");
  setScreen("result");
}

function showToast(message) {
  const oldToast = document.querySelector(".toast");
  if (oldToast) oldToast.remove();
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;
  document.querySelector(".phone-shell").append(toast);
  setTimeout(() => toast.remove(), 2000);
}

document.querySelector("[data-start]").addEventListener("click", () => setScreen("categories"));

document.querySelector("[data-random-category]").addEventListener("click", () => {
  const category = oracleData[Math.floor(Math.random() * oracleData.length)];
  chooseCategory(category);
});

categoryGrid.addEventListener("click", (event) => {
  const card = event.target.closest("[data-category]");
  if (!card) return;
  chooseCategory(oracleData.find((category) => category.id === card.dataset.category));
});

questionList.addEventListener("click", (event) => {
  const item = event.target.closest("[data-question-index]");
  if (!item) return;
  const index = Number(item.dataset.questionIndex);
  chooseQuestion(state.category.questions[index], index);
});

customQuestion.addEventListener("input", () => {
  const text = customQuestion.value.trim();
  state.question = text;
  state.selectedQuestionIndex = null;
  document.querySelectorAll(".question-option").forEach((button) => button.classList.remove("selected"));
  toRitualButton.disabled = text.length < 2;
});

toRitualButton.addEventListener("click", () => {
  if (!state.question) return;
  ritualQuestion.textContent = state.question;
  setScreen("ritual");
});

document.querySelector("[data-generate]").addEventListener("click", () => {
  ritualQuestion.textContent = "路线正在显影...";
  setTimeout(generateAnswer, 720);
});

document.querySelector("[data-regenerate]").addEventListener("click", () => {
  setScreen("categories");
});

document.querySelector("[data-share]").addEventListener("click", () => {
  showToast("分享卡文案已就绪：把这条路线发给朋友一起玄一下");
});

backButton.addEventListener("click", () => {
  const order = ["intro", "categories", "questions", "ritual", "result"];
  const currentIndex = order.indexOf(state.screen);
  if (currentIndex <= 0) return;
  setScreen(order[currentIndex - 1]);
});

renderCategories();
setScreen("intro");
