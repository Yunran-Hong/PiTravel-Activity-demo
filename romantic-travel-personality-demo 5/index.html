<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅行默契测试｜圆周旅迹</title>
    <style>
      :root {
        --brand: #1bb8f0;
        --ink: #202124;
        --muted: #6d747d;
        --paper: #fffdf4;
        --mint: #ddf8ce;
        --lemon: #fff2a6;
        --pink: #ffdce9;
        --sky: #d9f2ff;
        --orange: #ffd6a5;
        --line: #2d2d2d;
        --soft-line: #e5dcc7;
        --shadow-line: 5px 6px 0 var(--line);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, #fff6b8 0 11%, transparent 12%),
          radial-gradient(circle at 92% 20%, #d5f4ff 0 13%, transparent 14%),
          linear-gradient(135deg, #f5fbff 0%, #fff8dd 48%, #effde7 100%);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .phone {
        width: min(100vw, 430px);
        height: min(100vh, 932px);
        overflow: hidden;
        background: var(--paper);
        position: relative;
        box-shadow: 0 18px 45px rgba(49, 68, 89, 0.16);
      }

      .screen {
        height: 100%;
        overflow-y: auto;
        padding: 18px 20px 34px;
        scroll-behavior: smooth;
      }

      .status {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 18px;
        font-weight: 800;
      }

      .brand-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        color: var(--brand);
        background: #fff;
        box-shadow: 0 8px 22px rgba(56, 157, 199, 0.12);
        font-size: 13px;
        font-weight: 800;
      }

      .brand-mark {
        width: 22px;
        height: 13px;
        border-radius: 1px 1px 9px 9px;
        background: var(--brand);
        display: inline-block;
      }

      .topbar {
        margin: 12px 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 900;
        box-shadow: 3px 4px 0 var(--line);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 13px;
        font-weight: 850;
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
        animation: pop 0.18s ease-out;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .hero {
        position: relative;
        min-height: 420px;
        padding: 22px 18px 18px;
        border: 2.5px solid var(--line);
        border-radius: 30px;
        background:
          radial-gradient(circle at 13% 20%, rgba(255, 242, 166, 0.95), transparent 36%),
          radial-gradient(circle at 92% 21%, rgba(255, 220, 233, 0.78), transparent 31%),
          linear-gradient(180deg, #fffefa 0%, #f9ffe8 100%);
        box-shadow: 6px 8px 0 var(--line);
        overflow: hidden;
      }

      .hero h1 {
        margin: 10px 0 12px;
        max-width: 330px;
        font-size: 43px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .hero p {
        margin: 0;
        max-width: 318px;
        color: #525b65;
        font-size: 17px;
        line-height: 1.5;
        font-weight: 800;
      }

      .hero-art {
        position: absolute;
        right: 9px;
        bottom: 0;
        width: 205px;
        height: 178px;
      }

      .actions {
        margin-top: 18px;
      }

      .primary,
      .secondary,
      .wide-action {
        width: 100%;
        border: 2.5px solid var(--line);
        border-radius: 18px;
        padding: 15px 14px;
        min-height: 62px;
        background: #fff;
        box-shadow: 4px 5px 0 var(--line);
        text-align: center;
        font-weight: 950;
      }

      .primary {
        background: var(--brand);
        color: #fff;
      }

      .section-title {
        margin: 28px 0 14px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 25px;
        letter-spacing: 0;
      }

      .section-title span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .timeline {
        display: grid;
        gap: 10px;
      }

      .room-panel {
        margin-top: 16px;
        padding: 14px;
        border-radius: 22px;
        border: 2px solid var(--line);
        background: #fff;
        box-shadow: 4px 5px 0 var(--line);
      }

      .room-panel h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 108px;
        gap: 9px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .field input {
        width: 100%;
        height: 48px;
        border: 2px solid var(--line);
        border-radius: 15px;
        padding: 0 12px;
        background: #fffefa;
        color: var(--ink);
        font-weight: 900;
        outline: none;
      }

      .field input:focus {
        box-shadow: 0 0 0 4px rgba(27, 184, 240, 0.18);
      }

      .step {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 10px;
        align-items: center;
        padding: 12px;
        border-radius: 18px;
        background: #fff;
        border: 2px solid var(--soft-line);
      }

      .step-num {
        width: 36px;
        height: 36px;
        border: 2px solid var(--line);
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--mint);
        font-weight: 950;
      }

      .question-card,
      .card,
      .result-card {
        padding: 16px;
        border-radius: 24px;
        background: #fff;
        border: 2px solid var(--line);
        box-shadow: var(--shadow-line);
      }

      .question-card {
        background: var(--sky);
      }

      .question-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #52636d;
        font-size: 13px;
        font-weight: 850;
      }

      .question-card h2 {
        margin: 14px 0;
        font-size: 24px;
        line-height: 1.28;
      }

      .options {
        display: grid;
        gap: 9px;
      }

      .option {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 10px;
        min-height: 54px;
        padding: 12px 13px;
        border: 2px solid var(--line);
        border-radius: 16px;
        background: #fff;
        font-size: 15px;
        font-weight: 850;
        text-align: left;
      }

      .letter {
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: var(--mint);
        font-size: 14px;
        font-weight: 950;
      }

      .option-text {
        flex: 1;
        line-height: 1.45;
      }

      .progress-row {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .progress {
        flex: 1;
        height: 12px;
        padding: 2px;
        border-radius: 999px;
        background: #fff;
        border: 2px solid var(--line);
      }

      .progress span {
        display: block;
        width: 16%;
        height: 100%;
        border-radius: 999px;
        background: var(--brand);
        transition: width 0.2s ease;
      }

      .tabs {
        position: sticky;
        top: -18px;
        z-index: 3;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 8px 0 12px;
        background: var(--paper);
      }

      .tab {
        min-height: 44px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-weight: 950;
      }

      .tab.active {
        background: var(--lemon);
        box-shadow: 3px 4px 0 var(--line);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .person-hero {
        display: grid;
        grid-template-columns: 154px 1fr;
        gap: 14px;
        align-items: center;
      }

      .person-img {
        width: 154px;
        height: 150px;
        object-fit: contain;
        filter: drop-shadow(0 12px 0 rgba(45, 45, 45, 0.1));
      }

      .person-title h2 {
        margin: 0 0 6px;
        font-size: 27px;
        line-height: 1.05;
      }

      .percent {
        display: inline-flex;
        margin-top: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        border: 2px solid var(--line);
        background: var(--mint);
        font-weight: 950;
      }

      .quote {
        margin: 14px 0 0;
        padding: 12px;
        border-radius: 18px;
        background: var(--lemon);
        border: 2px solid var(--line);
        font-size: 16px;
        line-height: 1.45;
        font-weight: 900;
      }

      .content-block {
        margin-top: 14px;
        padding: 14px;
        border-radius: 18px;
        background: #fffefa;
        border: 2px solid var(--soft-line);
      }

      .content-block h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .content-block p {
        margin: 0;
        color: #4f555e;
        font-size: 14px;
        line-height: 1.6;
        font-weight: 700;
      }

      .axis {
        position: relative;
        height: 260px;
        margin-top: 12px;
        border: 2px solid var(--line);
        border-radius: 22px;
        background:
          linear-gradient(90deg, transparent calc(50% - 1px), rgba(45,45,45,0.45) calc(50% - 1px), rgba(45,45,45,0.45) calc(50% + 1px), transparent calc(50% + 1px)),
          linear-gradient(0deg, transparent calc(50% - 1px), rgba(45,45,45,0.45) calc(50% - 1px), rgba(45,45,45,0.45) calc(50% + 1px), transparent calc(50% + 1px)),
          linear-gradient(135deg, #fffefa, #effbea);
        overflow: hidden;
      }

      .axis-label {
        position: absolute;
        z-index: 1;
        color: #737a83;
        font-size: 12px;
        font-weight: 850;
      }

      .axis-left { left: 9px; top: 50%; transform: translateY(-50%); }
      .axis-right { right: 9px; top: 50%; transform: translateY(-50%); }
      .axis-top { left: 50%; top: 8px; transform: translateX(-50%); }
      .axis-bottom { left: 50%; bottom: 8px; transform: translateX(-50%); }

      .point {
        position: absolute;
        min-width: 14px;
        min-height: 14px;
        padding: 3px 6px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 11px;
        font-weight: 900;
        transform: translate(-50%, -50%);
        opacity: 0.58;
        white-space: nowrap;
      }

      .point.mine,
      .point.group {
        opacity: 1;
        background: var(--pink);
        box-shadow: 2px 3px 0 var(--line);
      }

      .group-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .mini-card {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 9px;
        align-items: center;
        padding: 10px;
        border: 2px solid var(--line);
        border-radius: 18px;
        background: #fff;
      }

      .mini-card img {
        width: 52px;
        height: 62px;
        object-fit: contain;
        filter: drop-shadow(0 5px 0 rgba(45, 45, 45, 0.08));
      }

      .mini-card strong,
      .pair-card strong {
        display: block;
        font-size: 15px;
      }

      .mini-card span,
      .muted {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.35;
      }

      .notice {
        padding: 14px;
        border-radius: 20px;
        border: 2px solid var(--line);
        background: var(--sky);
        box-shadow: 4px 5px 0 var(--line);
      }

      .notice h3 {
        margin: 0 0 6px;
        font-size: 20px;
      }

      .notice p,
      .story p,
      .empty-room p {
        margin: 0;
        color: #4f555e;
        font-size: 14px;
        line-height: 1.65;
        font-weight: 720;
        white-space: pre-line;
      }

      .empty-room {
        margin-top: 14px;
        padding: 16px;
        border-radius: 22px;
        border: 2px dashed var(--line);
        background: #fffefa;
        text-align: center;
      }

      .pair-grid {
        display: grid;
        gap: 10px;
      }

      .pair-card {
        padding: 14px;
        border-radius: 18px;
        border: 2px solid var(--line);
        background: #fff;
      }

      .pair-card.match {
        background:
          radial-gradient(circle at 18% 22%, rgba(221, 248, 206, 0.95), transparent 42%),
          #fff;
      }

      .pair-card.tension {
        background:
          radial-gradient(circle at 82% 18%, rgba(255, 220, 233, 0.95), transparent 40%),
          #fff;
      }

      .pair-visual {
        position: relative;
        height: 138px;
        margin-bottom: 12px;
        border-radius: 18px;
        border: 2px solid var(--line);
        background:
          linear-gradient(180deg, rgba(255, 253, 244, 0.9), rgba(255, 242, 166, 0.36)),
          #fff;
        overflow: hidden;
      }

      .pair-visual img {
        position: absolute;
        bottom: 6px;
        width: 104px;
        height: 118px;
        object-fit: contain;
        filter: drop-shadow(0 7px 0 rgba(45, 45, 45, 0.11));
        z-index: 2;
      }

      .pair-visual .left {
        left: 49%;
        transform: translateX(-105%) scaleX(-1) rotate(-3deg);
      }

      .pair-visual .right {
        right: 49%;
        transform: translateX(105%) rotate(3deg);
      }

      .pair-visual.tension .left {
        left: 12px;
        transform: rotate(-9deg);
      }

      .pair-visual.tension .right {
        right: 12px;
        transform: scaleX(-1) rotate(9deg);
      }

      .pair-badge {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        min-width: 68px;
        padding: 7px 11px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: var(--mint);
        text-align: center;
        font-size: 20px;
        font-weight: 950;
        box-shadow: 3px 4px 0 var(--line);
        z-index: 5;
      }

      .pair-visual.tension .pair-badge {
        background: var(--pink);
      }

      .pair-score {
        display: inline-flex;
        margin: 8px 0;
        padding: 6px 10px;
        border-radius: 999px;
        border: 2px solid var(--line);
        background: var(--lemon);
        font-weight: 950;
      }

      .travel-list {
        display: grid;
        gap: 10px;
      }

      .travel-list p {
        margin: 0;
        padding: 12px;
        border-radius: 16px;
        border: 2px solid var(--soft-line);
        background: #fff;
        font-size: 14px;
        line-height: 1.6;
        font-weight: 720;
      }

      .collection {
        padding: 16px;
        border-radius: 24px;
        border: 2px solid var(--line);
        background:
          radial-gradient(circle at 88% 18%, rgba(255, 220, 233, 0.9), transparent 26%),
          linear-gradient(145deg, #fffefa, #eaf9ff);
        box-shadow: var(--shadow-line);
      }

      .ratio-bars {
        display: grid;
        gap: 8px;
        margin: 12px 0;
      }

      .ratio {
        display: grid;
        grid-template-columns: 78px 1fr 42px;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        font-weight: 850;
      }

      .ratio-line {
        height: 12px;
        padding: 2px;
        border-radius: 999px;
        border: 2px solid var(--line);
        background: #fff;
      }

      .ratio-line span {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: var(--brand);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        padding: 8px 10px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 13px;
        font-weight: 850;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
        pointer-events: none;
        width: max-content;
        max-width: 330px;
        padding: 10px 14px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 13px;
        font-weight: 850;
        box-shadow: 4px 5px 0 var(--line);
        transition: 0.2s ease;
        z-index: 8;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 430px) {
        body {
          display: block;
          background: var(--paper);
        }

        .phone {
          width: 100vw;
          height: 100vh;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="旅行默契测试">
      <div class="screen" id="screen">
        <header class="status">
          <span>11:55</span>
          <span class="brand-pill"><i class="brand-mark"></i>圆周旅迹</span>
          <span>87</span>
        </header>

        <div class="topbar">
          <button class="icon-btn" type="button" data-back aria-label="返回">‹</button>
          <span class="tag" id="topTag">旅行人格测试</span>
          <button class="icon-btn" type="button" data-toast="活动已分享，等朋友一起发疯">↗</button>
        </div>

        <section class="view active" data-view="home">
          <div class="hero">
            <span class="tag">多人旅行人格测试</span>
            <h1>旅行默契测试</h1>
            <p>测测你在旅行搭子里到底是什么物种。6 道题之后，看看你是懂事长、急急国王，还是大馋丫头。</p>
            <svg class="hero-art" viewBox="0 0 188 162" aria-hidden="true">
              <path d="M24 106C43 81 65 70 95 75c39 7 57 33 54 55-4 26-40 35-74 22-31-11-61-20-51-46Z" fill="#fff" stroke="#2c2c2c" stroke-width="3" stroke-linecap="round"/>
              <path d="M44 82c-4-23 4-42 22-47 16-5 31 5 38 23 16-12 34-14 47 0 14 15 11 38-8 52" fill="#fff" stroke="#2c2c2c" stroke-width="3" stroke-linecap="round"/>
              <circle cx="72" cy="67" r="4" fill="#2c2c2c"/>
              <circle cx="116" cy="70" r="4" fill="#2c2c2c"/>
              <path d="M88 85c8 6 17 6 25 0" fill="none" stroke="#2c2c2c" stroke-width="3" stroke-linecap="round"/>
              <path d="M18 40c13-18 36-18 49-1-2 18-16 31-34 31C20 66 12 54 18 40Z" fill="#baf0c5" stroke="#2c2c2c" stroke-width="3"/>
              <path d="M142 24l12 18 21 5-15 14 2 22-20-10-19 9 3-21-15-15 21-4 10-18Z" fill="#ffdce9" stroke="#2c2c2c" stroke-width="3" stroke-linejoin="round"/>
            </svg>
          </div>

          <section class="room-panel">
            <h3>先加入一个旅行房间</h3>
            <div class="field-grid">
              <div class="field">
                <label for="playerName">你的用户名</label>
                <input id="playerName" maxlength="12" placeholder="例如：小圆" autocomplete="nickname" />
              </div>
              <div class="field">
                <label for="roomCode">房间码</label>
                <input id="roomCode" maxlength="8" placeholder="PU5UYF" autocomplete="off" />
              </div>
            </div>
          </section>

          <div class="actions">
            <button class="primary" type="button" data-go="quiz">开始测试</button>
          </div>

          <section class="section-title">
            <h2>会测出什么</h2>
            <span>可截图分享</span>
          </section>
          <div class="timeline">
            <div class="step"><span class="step-num">1</span><strong>完成 6 道旅行人格题</strong></div>
            <div class="step"><span class="step-num">2</span><strong>把你的真实结果加入这个房间</strong></div>
            <div class="step"><span class="step-num">3</span><strong>等朋友答完后生成多人友情报告</strong></div>
          </div>
        </section>

        <section class="view" data-view="quiz">
          <section class="section-title">
            <h2 id="questionTitle">Q1/6</h2>
            <span id="questionCount">1 / 6</span>
          </section>

          <section class="question-card">
            <div class="question-meta">
              <span id="questionMode">时间观念｜冲突表达｜隐性记仇</span>
              <span>点选后自动下一题</span>
            </div>
            <h2 id="questionText">搭子迟到了两个小时，仍然慢悠悠的，一点都不着急赶路，你会：</h2>
            <div class="options" id="options"></div>
            <div class="progress-row">
              <small class="muted" id="progressText">答题进度 1 / 6</small>

      function makeRoomCode() {

      function getRoomKey(roomCode = currentRoomCode) {
        return `pitravel-room-${roomCode || "default"}`;

      function dbRowToRoomUser(row) {
        return {
          name: row.user_name,
          answers: row.answers,

      function roomUserToDbRow(user) {
        const calculated = calculatePersonality(user.answers);
        return {
          room_code: currentRoomCode,

          answers: user.answers,
          result: calculated.result,
          percent: calculated.displayPercent,
          updated_at: new Date().toISOString(),

      function encodeRoomData() {
        return encodeURIComponent(JSON.stringify({
          v: 1,
          room: currentRoomCode,
          results: roomResults.map(({ name, answers, result, displayPercent }) => ({
            name,
            answers,
            result,
            percent: displayPercent,
          })),

      function hydrateRoomFromUrl() {
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const data = hash.get("data");
        const roomFromUrl = hash.get("room");
        if (roomFromUrl) currentRoomCode = roomFromUrl.toUpperCase();
        if (!data) return;
        try {
          const parsed = JSON.parse(decodeURIComponent(data));
          if (parsed.room) currentRoomCode = parsed.room.toUpperCase();
          if (Array.isArray(parsed.results)) {
            roomResults = parsed.results
              .filter((item) => item.name && Array.isArray(item.answers) && item.answers.length === questions.length)
              .map((item) => ({ name: item.name, answers: item.answers }));
          }
        } catch (error) {
          roomResults = [];
        }
      }

      function loadRoomFromStorage() {
        if (!currentRoomCode) return;
        try {
          const saved = JSON.parse(localStorage.getItem(getRoomKey()) || "[]");
          if (Array.isArray(saved) && saved.length > roomResults.length) roomResults = saved;
        } catch (error) {
          roomResults = [];
        }
      }

      function saveRoomState(updateHash = true) {
        if (!currentRoomCode) return;
        localStorage.setItem(getRoomKey(), JSON.stringify(roomResults));
        if (updateHash) {
          const hash = new URLSearchParams();
          hash.set("room", currentRoomCode);
          hash.set("data", encodeRoomData());
          history.replaceState(null, "", `${location.pathname}#${hash.toString()}`);
        }
      }

      async function loadRoomFromSupabase() {
        if (!supabaseClient || !currentRoomCode) return false;
        const { data, error } = await supabaseClient
          .from("travel_test_results")
          .select("user_name, answers, result, percent, updated_at")
          .eq("room_code", currentRoomCode)
          .order("updated_at", { ascending: false });
        if (error) {
          showToast("房间同步失败，先使用本地结果。");
          return false;
        }
        roomResults = (data || [])
          .filter((row) => row.user_name && Array.isArray(row.answers) && row.answers.length === questions.length)
          .map(dbRowToRoomUser);
        saveRoomState(false);
        return true;
      }

      async function saveRoomToSupabase(user) {
        if (!supabaseClient || !currentRoomCode) return false;
        const { error } = await supabaseClient
          .from("travel_test_results")
          .upsert(roomUserToDbRow(user), { onConflict: "room_code,user_name" });
        if (error) {
          showToast("结果同步失败，已先保存在本机。");
          return false;
        }
        return true;
      }

      async function refreshRoomResults() {
        if (supabaseClient) {
          const synced = await loadRoomFromSupabase();
          if (synced) return;
        }
        loadRoomFromStorage();
      }

      function subscribeRoom() {
        if (!supabaseClient || !currentRoomCode) return;
        if (roomChannel) supabaseClient.removeChannel(roomChannel);
        roomChannel = supabaseClient
          .channel(`travel-room-${currentRoomCode}`)
          .on(
            "postgres_changes",
            {
              event: "*",
              schema: "public",
              table: "travel_test_results",
              filter: `room_code=eq.${currentRoomCode}`,
            },
            async () => {
              await loadRoomFromSupabase();
              if (currentView === "result") renderFriends();
            }
          )
          .subscribe();
      }

      function calculatePersonality(answers) {
        const scores = Object.fromEntries(personalityIds.map((id) => [id, 0]));
        answers.forEach((answer, index) => {
          const rule = scoringRules[`Q${index + 1}`][answer];
          Object.entries(rule).forEach(([id, score]) => {
            if (!scores.hasOwnProperty(id)) return;
            scores[id] += score;
          });
        });
        const result = resolveTie(scores, answers);
        const totalScore = Object.values(scores).reduce((sum, score) => sum + score, 0);
        const rawPercent = totalScore ? scores[result] / totalScore : 0;
        const displayPercent = Math.min(96, Math.max(72, Math.round(rawPercent * 100)));
        return { scores, result, rawPercent, displayPercent };
      }

      function resolveTie(scores, answers) {
        const maxScore = Math.max(...Object.values(scores));
        let tied = Object.keys(scores).filter((id) => scores[id] === maxScore);
        const has = (id) => tied.includes(id);
        if (has("POSE") && ["A", "D"].includes(answers[5])) return "POSE";
        if (has("FOOD") && (["A", "B", "D"].includes(answers[1]) || answers[4] === "C")) return "FOOD";
        if (has("IMNB") && has("PUSH")) {
          if (answers[2] === "A") return "IMNB";
          if (answers[4] === "A" || ["C", "D"].includes(answers[3])) return "PUSH";
        }
        if (has("REST") && has("BABY")) {
          if (answers[3] === "A") return "REST";
          if (answers[3] === "B") return "BABY";
        }
        for (let i = answers.length - 1; i >= 0; i -= 1) {
          const rule = scoringRules[`Q${i + 1}`][answers[i]];
          const triggered = Object.keys(rule).filter((id) => tied.includes(id));
          if (triggered.length === 1) return triggered[0];
        }
        return defaultPriority.find((id) => tied.includes(id));
      }

      function getPersonalityContent(result) {
        return {
          id: result,
          ...personalityContent[result],
          coordinate: personalityCoordinates[result],
          image: imageMap[result],
        };
      }

      function calculateGroupResults(users) {
        const enriched = users.map((user, index) => {
          const result = calculatePersonality(user.answers);
          return {
            ...user,
            ...result,
            coordinate: {
              x: personalityCoordinates[result.result].x + (index - 1.5) * 4,
              y: personalityCoordinates[result.result].y + (index % 2 === 0 ? 4 : -4),
            },
          };
        });
        const pairs = [];
        for (let i = 0; i < enriched.length; i += 1) {
          for (let j = i + 1; j < enriched.length; j += 1) {
            const a = enriched[i];
            const b = enriched[j];
            const dx = personalityCoordinates[a.result].x - personalityCoordinates[b.result].x;
            const dy = personalityCoordinates[a.result].y - personalityCoordinates[b.result].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const score = Math.max(52, Math.min(92, Math.round(92 - distance * 0.22)));
            pairs.push({ a, b, score, distance });
          }
        }
        const sortedPairs = pairs.sort((a, b) => b.score - a.score);
        const best = sortedPairs[0];
        const hardest = sortedPairs[sortedPairs.length - 1];
        const matchPairs = [];
        if (best) {
          matchPairs.push({
            type: "最高 Match",
            pair: `${best.a.name} × ${best.b.name}`,
            people: [best.a.name, best.b.name],
            mood: "match",
            score: best.score,
            desc: `${best.a.name} 和 ${best.b.name} 的旅行节奏比较容易接上，一个人的情绪不会太用力地撞到另一个人的边界。适合慢慢走、慢慢吃、边玩边修复。`,
            risk: "太舒服也可能导致问题被糊弄过去，真的不开心时还是要把话说出来。",
          });
        }
        if (hardest && hardest !== best) {
          matchPairs.push({
            type: "最容易拉扯",
            pair: `${hardest.a.name} × ${hardest.b.name}`,
            people: [hardest.a.name, hardest.b.name],
            mood: "tension",
            score: hardest.score,
            desc: `${hardest.a.name} 和 ${hardest.b.name} 的处理节奏差异更明显，一个可能想马上推进，一个可能想先缓一缓。一起出门时很容易出现“你怎么不懂我”的小型拉扯。`,
            risk: "出发前先约定好休息、拍照、吃饭和临时改计划的处理方式。",
          });
        }
        return {
          users: enriched,
          groupSummary: groupText.groupSummary,
          matchPairs,
          travelRecommendation: groupText.travelRecommendation,
          cityCollection: groupText.cityCollection,
        };
      }

      function renderQuestion() {
        const item = questions[questionIndex];
        questionTitle.textContent = `${item.id}/${questions.length}`;
        questionCount.textContent = `${questionIndex + 1} / ${questions.length}`;
        questionMode.textContent = item.tags;
        questionText.textContent = item.text;
        progressText.textContent = `答题进度 ${questionIndex + 1} / ${questions.length}`;
        progressBar.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
        optionsRoot.innerHTML = Object.entries(item.options)
          .map(([letter, option]) => `<button class="option" type="button" data-answer="${letter}"><span class="letter">${letter}</span><span class="option-text">${option}</span></button>`)
          .join("");
      }

      function axisPointStyle(coordinate) {
        const left = (coordinate.x + 100) / 2;
        const top = (100 - coordinate.y) / 2;
        return `left:${left}%;top:${top}%`;
      }

      function renderAxis(activeId, groupUsers = null) {
        const labels = `<span class="axis-label axis-left">行程推进</span><span class="axis-label axis-right">感受享受</span><span class="axis-label axis-top">外放表达</span><span class="axis-label axis-bottom">内收消化</span>`;
        if (groupUsers) {
          return `<div class="axis">${labels}${groupUsers.map((user) => {
            const content = getPersonalityContent(user.result);
            return `<span class="point group" style="${axisPointStyle(user.coordinate)}">${user.name} ${content.name}</span>`;
          }).join("")}</div>`;
        }
        return `<div class="axis">${labels}${personalityIds.map((id) => {
          const content = getPersonalityContent(id);
          const cls = id === activeId ? "point mine" : "point";
          return `<span class="${cls}" style="${axisPointStyle(content.coordinate)}">${content.name}</span>`;
        }).join("")}</div>`;
      }

      function renderPairVisual(pair, users) {
        const [firstName, secondName] = pair.people;
        const first = users.find((user) => user.name === firstName);
        const second = users.find((user) => user.name === secondName);
        if (!first || !second) return "";
        const firstContent = getPersonalityContent(first.result);
        const secondContent = getPersonalityContent(second.result);
        const badge = pair.mood === "match" ? "抱一下" : "别打了";
        return `
          <div class="pair-visual ${pair.mood}">
            <img class="left" src="${firstContent.image}" alt="${first.name}" />
            <span class="pair-badge">${badge}</span>
            <img class="right" src="${secondContent.image}" alt="${second.name}" />
          </div>
        `;
      }

      function renderResults() {
        if (!myResult) myResult = calculatePersonality(myAnswers);
        renderMine();
        renderFriends();
        setActiveTab("mine");
      }

      function renderMine() {
        const content = getPersonalityContent(myResult.result);
        minePanel.innerHTML = `
          <section class="result-card">
            <div class="person-hero">
              <img class="person-img" src="${content.image}" alt="${content.name}" />
              <div class="person-title">
                <h2>${content.name}<br />${content.label}</h2>
                <span class="percent">匹配度 ${myResult.displayPercent}%</span>
              </div>
            </div>
            <div class="quote">${content.line}</div>
            <div class="content-block"><h3>命中维度</h3><p>${content.dimensions}</p></div>
            <div class="content-block"><h3>用户画像</h3><p>${content.profile}</p></div>
            <div class="content-block"><h3>旅行小提醒</h3><p>${content.tip}</p></div>
            <button class="wide-action primary" type="button" data-share-room>复制房间链接，邀请朋友一起测</button>
            <p class="muted" style="margin: 10px 0 0">${supabaseClient ? "朋友输入同一个房间码完成测试后，结果会自动同步到这里。" : "还没配置 Supabase，当前只能在本机或通过链接接力查看结果。"}</p>
          </section>
        `;
      }

      function renderFriends() {
        const group = calculateGroupResults(roomResults);
        if (group.users.length < 2) {
          friendsPanel.innerHTML = `
            <section class="notice">
              <h3>看看你们的旅行友情关系</h3>
              <p>这个房间现在有 ${group.users.length} 位成员完成测试。等至少 2 个人答完，就会生成真实的 Match / Not Match 和旅行友情报告。${supabaseClient ? "同房间码会自动同步。" : "当前还没连接 Supabase，只能本机保存。"}</p>
            </section>
            <section class="empty-room">
              <h3>房间 ${currentRoomCode}</h3>
              <p>${group.users.length ? `已加入：${group.users.map((user) => user.name).join("、")}` : "还没有成员完成测试。"}</p>
              <button class="wide-action primary" style="margin-top:14px" type="button" data-share-room>复制房间链接</button>
            </section>
          `;
          return;
        }
        friendsPanel.innerHTML = `
          <section class="notice">
            <h3>看看你们的旅行友情关系</h3>
            <p>基于 ${group.users.map((user) => user.name).join("、")} 的真实测试结果，生成你们的旅行相处模式、Match 指数和适合一起去的地点合集。</p>
          </section>

          <section class="section-title"><h2>四人结果</h2><span>小队图鉴</span></section>
          <div class="group-grid">
            ${group.users.map((user) => {
              const content = getPersonalityContent(user.result);
              return `<div class="mini-card"><img src="${content.image}" alt="${content.name}" /><div><strong>${user.name}</strong><span>${content.name} ${content.label}</span></div></div>`;
            }).join("")}
          </div>

          <section class="content-block"><h3>多人坐标轴</h3>${renderAxis(null, group.users)}</section>

          <section class="content-block story"><h3>这组的整体状态</h3><p>${group.groupSummary}</p></section>
          <button class="wide-action primary" type="button" data-share-room>复制房间链接</button>

          <section class="section-title"><h2>Match / Not Match</h2><span>两对关系</span></section>
          <div class="pair-grid">
            ${group.matchPairs.map((pair) => `<div class="pair-card ${pair.mood}">${renderPairVisual(pair, group.users)}<strong>${pair.type}：${pair.pair}</strong><span class="pair-score">Match 指数：${pair.score}%</span><p class="muted">${pair.desc}</p><p class="muted" style="margin-top:8px"><b>小风险：</b>${pair.risk}</p></div>`).join("")}
          </div>

          <section class="section-title"><h2>适合的旅行方式</h2><span>三段建议</span></section>
          <div class="travel-list">${group.travelRecommendation.map((text) => `<p>${text}</p>`).join("")}</div>
          <button class="wide-action primary" style="margin-top:12px" type="button" data-toast="成都旅行地点合集已生成。">生成旅行地点合集</button>

          ${renderCityCollection(group.cityCollection)}
        `;
      }

      function renderCityCollection(collection) {
        return `
          <section class="section-title"><h2>城市地点合集</h2><span>成都</span></section>
          <section class="collection">
            <h2 style="margin:0 0 8px">${collection.title}</h2>
            <p class="muted">${collection.intro}</p>
            <div class="ratio-bars">
              ${collection.ratios.map(([name, value]) => `<div class="ratio"><span>${name}</span><div class="ratio-line"><span style="width:${value}%"></span></div><strong>${value}%</strong></div>`).join("")}
            </div>
            <div class="chips">${collection.places.map((place) => `<span class="chip">${place}</span>`).join("")}</div>
            <div class="button-row">
              <button class="wide-action" type="button" data-toast="已为你打开成都地点合集。">查看地点合集</button>
              <button class="wide-action primary" type="button" data-toast="已保存到我的地图。">保存到我的地图</button>
            </div>
          </section>
        `;
      }

      function setActiveTab(tabName) {
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === tabName));
        minePanel.classList.toggle("active", tabName === "mine");
        friendsPanel.classList.toggle("active", tabName === "friends");
        screen.scrollTop = 0;
      }

      document.addEventListener("click", async (event) => {
        const target = event.target.closest("button");
        if (!target) return;
        if (target.dataset.go) {
          if (target.dataset.go === "quiz") {
            syncRoomInputs();
            if (!currentPlayerName) {
              showToast("先填一个用户名，朋友才知道你是谁。");
              playerNameInput.focus();
              return;
            }
            await refreshRoomResults();
            subscribeRoom();
            saveRoomState(false);
            questionIndex = 0;
            myAnswers = [];
            myResult = null;
          }
          await showView(target.dataset.go);
          return;
        }
        if (target.dataset.answer) {
          myAnswers[questionIndex] = target.dataset.answer;
          if (questionIndex < questions.length - 1) {
            questionIndex += 1;
            renderQuestion();
          } else {
            await addCurrentResultToRoom();
            await showView("result");
          }
          return;
        }
        if (target.dataset.tab) {
          if (target.dataset.tab === "friends") {
            await refreshRoomResults();
            renderFriends();
          }
          setActiveTab(target.dataset.tab);
          return;
        }
        if (target.dataset.toast) {
          showToast(target.dataset.toast);
          return;
        }
        if (target.dataset.shareRoom !== undefined) {
          copyRoomLink();
          return;
        }
        if (target.dataset.back !== undefined) {
          if (currentView === "home") showToast("已经在首页了。");
          else await showView("home");
        }
      });

      hydrateRoomFromUrl();
      if (!currentRoomCode) currentRoomCode = makeRoomCode();
      roomCodeInput.value = currentRoomCode;
      refreshRoomResults().then(() => {
        subscribeRoom();
        if (currentView === "result") renderFriends();
      });
      renderQuestion();
    </script>
  </body>
</html>
